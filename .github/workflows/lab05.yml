name: Lab 5 build browser checks and report
on:
  push:
    branches: [lab05]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and run Java tests
        run: mvn -B -ntp clean verify
      - name: Install report and browser dependencies
        run: python -m pip install python-docx pillow playwright
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Check the live application and capture browser screenshots
        run: python scripts/capture_lab05.py
      - name: Install PDF converter
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-dejavu
      - name: Build the report from actual observations
        run: python scripts/build_lab05_report.py
      - name: Convert the report to PDF
        run: >
          libreoffice -env:UserInstallation=file:///tmp/lab05-lo
          --headless --convert-to pdf --outdir submission
          submission/Lab05_Turgynbek_Amirbek_IS2413.docx
      - name: Upload the report and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Lab05-Report-and-Evidence
          path: |
            submission/Lab05_Turgynbek_Amirbek_IS2413.docx
            submission/Lab05_Turgynbek_Amirbek_IS2413.pdf
            evidence/lab05/
          if-no-files-found: error
      - name: Upload the runnable application
        uses: actions/upload-artifact@v4
        with:
          name: Lab05-Application
          path: target/spring-lab-01-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lab05-Errors
          path: |
            evidence/
            target/surefire-reports/
          if-no-files-found: ignore
