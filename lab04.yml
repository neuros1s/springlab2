name: Lab 4 build and report
on:
  push:
    branches: [lab04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mvn -B -ntp clean verify
      - run: python -m pip install python-docx pillow
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-dejavu
      - run: python scripts/build_report.py
      - run: libreoffice -env:UserInstallation=file:///tmp/lab04-lo --headless --convert-to pdf --outdir submission submission/Lab04_Turgynbek_Amirbek_IS2413.docx
      - uses: actions/upload-artifact@v4
        with:
          name: Lab04-Report-and-Project
          path: |
            submission/Lab04_Turgynbek_Amirbek_IS2413.docx
            submission/Lab04_Turgynbek_Amirbek_IS2413.pdf
            evidence/
            target/spring-lab-01-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Lab04-Errors
          path: |
            evidence/
            target/surefire-reports/
          if-no-files-found: ignore
