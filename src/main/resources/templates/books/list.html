<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container">
    <header class="page-heading">
        <a class="back-link" th:href="@{/}">Home</a>
        <h1 th:text="${title}">Catalogue</h1>
        <p class="muted">Browse the collection or add a book to the library.</p>
    </header>
    <p th:if="${message}" class="flash" role="status" th:text="${message}"></p>
    <section class="card">
        <form method="get" th:action="@{/books}" class="filter-form">
            <div class="field grow">
                <label for="filterAuthor">Filter by author</label>
                <input id="filterAuthor" name="author" th:value="${author}"
                       placeholder="For example, Bloch">
            </div>
            <button type="submit">Apply filter</button>
            <a class="secondary" th:href="@{/books}">Show all</a>
        </form>
    </section>
    <section class="card table-card" aria-label="Book collection">
        <table>
            <thead><tr><th scope="col">#</th><th scope="col">Title</th>
                <th scope="col">Author</th><th scope="col">Year</th></tr></thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>
                <td th:text="${book.title}">Title</td>
                <td th:text="${book.author}">Author</td>
                <td th:text="${book.year}">2020</td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(books)}" class="empty">No books match this author.</p>
    </section>
    <section class="card">
        <h2>Add a book</h2>
        <form method="post" th:action="@{/books}">
            <div class="book-fields">
                <div class="field"><label for="bookTitle">Title</label>
                    <input id="bookTitle" name="title" required maxlength="200"></div>
                <div class="field"><label for="bookAuthor">Author</label>
                    <input id="bookAuthor" name="author" required maxlength="200"></div>
                <div class="field year-field"><label for="bookYear">Year</label>
                    <input id="bookYear" name="year" type="number" min="1" max="9999" required></div>
            </div>
            <button type="submit">Add book</button>
        </form>
    </section>
</main>
</body>
</html>
